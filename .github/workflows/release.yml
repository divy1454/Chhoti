name: Build & release APK

# Every push to main builds a signed APK and publishes it as GitHub Release v<run number>.
# The installed app checks the latest release and offers a one-tap update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Load signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. See README 'Signing key'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chhoti.jks"
          echo "CHHOTI_KEYSTORE=$RUNNER_TEMP/chhoti.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          CHHOTI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHHOTI_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CHHOTI_KEY_ALIAS: chhoti
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/lite/release/app-lite-release.apk "chhoti-lite-v$N.apk"
          cp app/build/outputs/apk/full/release/app-full-release.apk "chhoti-full-v$N.apk"
          gh release create "v$N" "chhoti-lite-v$N.apk" "chhoti-full-v$N.apk" \
            --title "Chhoti 1.0.$N" \
            --notes "${NOTES:-Manual build}"
